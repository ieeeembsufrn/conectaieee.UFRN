<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1e40af">
  <title>Offline - ConectaIEEE</title>
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/android-launchericon-192-192.png">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #f9fafb;
      color: #111827;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100% - 32px, 420px);
      text-align: center;
      padding: 32px 24px;
    }

    img {
      width: 96px;
      height: 96px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      line-height: 1.2;
    }

    p {
      margin: 0;
      color: #4b5563;
      line-height: 1.5;
    }

    .actions {
      display: grid;
      gap: 12px;
      margin-top: 28px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      color: #ffffff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .primary {
      background: #2563eb;
    }

    .secondary {
      background: #6b7280;
    }

    footer {
      margin-top: 28px;
      color: #6b7280;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <img src="/assets/android-launchericon-192-192.png" alt="ConectaIEEE">
    <h1>Você está offline</h1>
    <p>Não foi possível conectar à internet. Verifique sua conexão e tente novamente.</p>

    <div class="actions">
      <button class="primary" onclick="window.location.reload()">Tentar novamente</button>
      <button class="secondary" onclick="history.back()">Voltar</button>
    </div>

    <footer>ConectaIEEE - Modo offline</footer>
  </main>

  <script>
    setInterval(function () {
      if (navigator.onLine) {
        window.location.reload();
      }
    }, 5000);

    window.addEventListener('online', function () {
      window.location.reload();
    });
  </script>
</body>
</html>
